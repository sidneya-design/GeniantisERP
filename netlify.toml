[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[functions."send-birthdays"]
  # 07:00 no horário de Brasília (UTC-3) = 10:00 UTC
  schedule = "0 10 * * *"

# Arquivos estáticos do aplicativo de aniversariantes
[[redirects]]
  from = "/aniversariantes-app/*"
  to = "/aniversariantes-app/:splat"
  status = 200

# Regra de roteamento SPA para rotas internas do GeniantisERP
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"

# Cabeçalhos de segurança em todo o site
[[headers]]
  for = "/*"
  [headers.values]
    # Só o próprio site pode exibir o ERP em iframe (o painel de aniversariantes usa isso)
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

