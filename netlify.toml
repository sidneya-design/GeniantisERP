[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[functions."send-birthdays"]
  # 07:00 no horário de Brasília (UTC-3) = 10:00 UTC
  schedule = "0 10 * * *"

# Arquivos estáticos do aplicativo de aniversariantes
[[redirects]]
  from = "/aniversariantes-app/*"
  to = "/aniversariantes-app/:splat"
  status = 200

# Regra de roteamento SPA para rotas internas do GeniantisERP
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
